<aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="sidebar-header">
        <div class="sidebar-brand">
            @if (!collapsed()) {
                <span>جلسة</span>
            } @else {
                <span>ج</span>
            }
        </div>
        <button class="toggle-btn" (click)="toggleSidebar()" [attr.aria-label]="collapsed() ? 'توسيع الشريط الجانبي' : 'طي الشريط الجانبي'">
            <i class="bi" [class.bi-chevron-left]="!collapsed()" [class.bi-chevron-right]="collapsed()"></i>
        </button>
    </div>
    <nav class="sidebar-nav" aria-label="التنقل الرئيسي">
        <ul class="nav flex-column">
            @for (item of menuItems(); track item.route) {
                <li class="nav-item">
                    <a class="nav-link"
                       [routerLink]="item.route"
                       routerLinkActive="active"
                       [routerLinkActiveOptions]="{ exact: false }"
                       [attr.aria-label]="item.label">
                        <i class="bi {{ item.icon }}"></i>
                        @if (!collapsed()) {
                            <span>{{ item.label }}</span>
                        }
                    </a>
                </li>
            }
        </ul>
    </nav>
</aside>
