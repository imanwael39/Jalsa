@if (isShowing) {
    <div
        class="toast show"
        [class]="typeClass"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
        (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()"
    >
        <div class="toast-header">
            <i class="bi me-2" [class]="typeIcon" [class.text-success]="type === 'success'" [class.text-danger]="type === 'error'" [class.text-warning]="type === 'warning'" [class.text-info]="type === 'info'" aria-hidden="true"></i>
            @if (title) {
                <strong class="me-auto">{{ title }}</strong>
            }
            <small class="text-muted">just now</small>
            @if (dismissible) {
                <button
                    type="button"
                    class="btn-close"
                    aria-label="Close"
                    (click)="close()"
                ></button>
            }
        </div>
        <div class="toast-body">
            {{ message }}
        </div>
    </div>
}
