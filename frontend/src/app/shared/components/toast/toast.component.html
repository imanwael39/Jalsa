<div class="type-{{ type }}">
    <div class="toast-wrapper" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header-custom">
            <div class="toast-icon toast-icon-{{ type }}">
                @switch (type) {
                    @case ('success') { &#10003; }
                    @case ('error') { &#10007; }
                    @case ('warning') { ! }
                    @case ('info') { i }
                }
            </div>
            <span class="toast-title">
                @switch (type) {
                    @case ('success') { نجاح }
                    @case ('error') { خطأ }
                    @case ('warning') { تنبيه }
                    @case ('info') { معلومة }
                }
            </span>
            <button type="button" class="toast-close" aria-label="إغلاق" (click)="close()">&times;</button>
        </div>
        <div class="toast-body">{{ message }}</div>
    </div>
</div>
