<button
    [type]="type"
    [class]="buttonClasses"
    [disabled]="isDisabled"
    [attr.aria-busy]="loading || null"
    [attr.aria-disabled]="isDisabled || null"
    [attr.aria-label]="ariaLabel || null"
    (click)="onClick($event)"
>
    @if (loading) {
        <span class="spinner" aria-hidden="true"></span>
    }
    <ng-content></ng-content>
</button>
