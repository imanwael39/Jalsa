<div class="report-list">
    <div class="page-header">
        <h2 class="page-title">التقارير</h2>
        <app-button variant="primary" (clicked)="navigateToGenerate()" ariaLabel="إنشاء تقرير جديد">
            <i class="bi bi-file-earmark-plus" aria-hidden="true"></i> إنشاء تقرير بالذكاء الاصطناعي
        </app-button>
    </div>

    @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
    }

    <div class="table-responsive">
        <app-table
            [data]="reports()"
            [columns]="columns"
            [loading]="loading()"
            emptyMessage="لا توجد تقارير لهذا المريض بعد."
            (rowClick)="onRowClick($event)"
        >
            <ng-template appColumnCell="createdAt" let-row>
                {{ formatDate(row.createdAt) }}
            </ng-template>
            <ng-template appColumnCell="status" let-row>
                <span
                    class="badge"
                    [class.bg-secondary]="row.status === 'Draft'"
                    [class.bg-success]="row.status === 'Approved'"
                >
                    {{ row.status | statusAr }}
                </span>
            </ng-template>
            <ng-template appColumnCell="versionCount" let-row>
                {{ getVersionCount(row) }}
            </ng-template>
            <ng-template appColumnCell="actions" let-row>
                <div class="d-flex gap-1 justify-content-center">
                    <app-button
                        variant="secondary"
                        size="sm"
                        (clicked)="navigateToView(row.id)"
                        ariaLabel="عرض التقرير"
                    >
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </app-button>
                    <app-button variant="danger" size="sm" (clicked)="openDeleteModal(row.id)" ariaLabel="حذف التقرير">
                        <i class="bi bi-trash" aria-hidden="true"></i>
                    </app-button>
                </div>
            </ng-template>
        </app-table>
    </div>

    <app-modal
        [showModal]="showDeleteModal()"
        (showModalChange)="showDeleteModal.set($event)"
        title="حذف التقرير"
        size="sm"
    >
        <div modal-body>
            <p>هل أنت متأكد من حذف هذا التقرير؟</p>
            <p class="text-danger">
                <i class="bi bi-exclamation-triangle" aria-hidden="true"></i> لا يمكن التراجع عن هذا الإجراء.
            </p>
        </div>
        <div modal-footer>
            <app-button variant="ghost" (clicked)="closeDeleteModal()">إلغاء</app-button>
            <app-button variant="danger" (clicked)="deleteReport()">حذف التقرير</app-button>
        </div>
    </app-modal>
</div>
