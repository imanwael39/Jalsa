<div class="voice-recorder">
    <label class="form-label">ملاحظة صوتية</label>
    <div class="d-flex align-items-center gap-2">
        <input
            type="file"
            accept="audio/*"
            class="form-control"
            (change)="onFileSelected($event)"
            [disabled]="uploading()"
            ariaLabel="اختر ملف صوتي"
        />
        @if (selectedFile()) {
            <app-button
                variant="primary"
                size="sm"
                (clicked)="upload()"
                [disabled]="uploading()"
                ariaLabel="رفع ملاحظة صوتية">
                @if (uploading()) {
                    <app-spinner size="sm"></app-spinner>
                } @else {
                    <i class="bi bi-upload" aria-hidden="true"></i> رفع
                }
            </app-button>
        }
    </div>
</div>
