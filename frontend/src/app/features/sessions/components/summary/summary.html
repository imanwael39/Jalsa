<div class="summary">
    <h5>ملخص الذكاء الاصطناعي</h5>

    <app-ai-disclaimer [blocked]="!!error()" [message]="error() || ''"></app-ai-disclaimer>

    @if (loading()) {
        <div class="text-center py-3">
            <app-spinner size="md"></app-spinner>
        </div>
    } @else if (error()) {
        <!-- error message already surfaced via app-ai-disclaimer above -->
    } @else if (summary()) {
        <div class="summary-content">
            {{ summary() }}
        </div>
    } @else {
        <div class="text-muted">لا يوجد ملخص متاح.</div>
    }
</div>
