<div class="session-list">
    <div class="page-header">
        <h2 class="page-title">الجلسات</h2>
        <app-button variant="primary" (clicked)="navigateToNew()" ariaLabel="إنشاء جلسة جديدة">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> جلسة جديدة +
        </app-button>
    </div>

    @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
    }

    <div class="table-responsive">
        <app-table
            [data]="sessions()"
            [columns]="columns"
            [loading]="loading()"
            emptyMessage="لم يتم العثور على جلسات لهذا المريض."
            (rowClick)="onRowClick($event)"
        >
            <ng-template appColumnCell="sessionDate" let-row>
                {{ formatDate(row.sessionDate) }}
            </ng-template>
            <ng-template appColumnCell="sessionType" let-row>
                {{ row.sessionType || '-' }}
            </ng-template>
            <ng-template appColumnCell="durationMinutes" let-row>
                {{ formatDuration(row.durationMinutes) }}
            </ng-template>
            <ng-template appColumnCell="status" let-row>
                <span
                    class="badge"
                    [class.bg-secondary]="row.status === 'Draft'"
                    [class.bg-success]="row.status === 'Completed'"
                    [class.bg-warning]="row.status === 'Archived'"
                >
                    {{ row.status | statusAr }}
                </span>
            </ng-template>
            <ng-template appColumnCell="actions" let-row>
                <div class="d-flex gap-1 justify-content-center">
                    <app-button variant="secondary" size="sm" (clicked)="navigateToView(row.id)" ariaLabel="عرض الجلسة">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </app-button>
                    <app-button variant="primary" size="sm" (clicked)="navigateToEdit(row.id)" ariaLabel="تعديل الجلسة">
                        <i class="bi bi-pencil" aria-hidden="true"></i>
                    </app-button>
                    <app-button variant="danger" size="sm" (clicked)="openDeleteModal(row.id)" ariaLabel="حذف الجلسة">
                        <i class="bi bi-trash" aria-hidden="true"></i>
                    </app-button>
                </div>
            </ng-template>
        </app-table>
    </div>

    <app-modal
        [showModal]="showDeleteModal()"
        (showModalChange)="showDeleteModal.set($event)"
        title="حذف الجلسة"
        size="sm"
    >
        <div modal-body>
            <p>هل أنت متأكد من حذف هذه الجلسة؟</p>
            <p class="text-danger">
                <i class="bi bi-exclamation-triangle" aria-hidden="true"></i> لا يمكن التراجع عن هذا الإجراء.
            </p>
        </div>
        <div modal-footer>
            <app-button variant="ghost" (clicked)="closeDeleteModal()">إلغاء</app-button>
            <app-button variant="danger" (clicked)="deleteSession()">حذف الجلسة</app-button>
        </div>
    </app-modal>
</div>
