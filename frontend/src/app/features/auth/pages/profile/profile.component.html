<div class="profile-container">
    <h2 class="mb-4">الملف الشخصي</h2>

    @if (loading()) {
        <div class="text-center py-5">
            <app-spinner size="lg" label="جاري التحميل..."></app-spinner>
        </div>
    }

    @if (!loading()) {
        @if (success()) {
            <div class="alert alert-success" role="alert">تم حفظ التغييرات بنجاح!</div>
        }

        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">المعلومات الشخصية</h5>
            </div>
            <div class="card-body">
                <form [formGroup]="profileForm">
                    <div class="row">
                        <div class="col-md-6">
                            <app-input
                                label="الاسم الأول"
                                type="text"
                                placeholder="أدخل الاسم الأول"
                                formControlName="firstName"
                                [error]="getFirstNameError()"
                            ></app-input>
                        </div>
                        <div class="col-md-6">
                            <app-input
                                label="اسم العائلة"
                                type="text"
                                placeholder="أدخل اسم العائلة"
                                formControlName="lastName"
                                [error]="getLastNameError()"
                            ></app-input>
                        </div>
                    </div>

                    <app-input
                        label="البريد الإلكتروني"
                        type="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        formControlName="email"
                        [error]="getEmailError()"
                    ></app-input>

                    @if (error()) {
                        <div class="alert alert-danger mt-3">
                            {{ error() }}
                        </div>
                    }

                    <div class="mt-3">
                        <app-button type="button" variant="primary" [loading]="updating()" (click)="updateProfile()"
                            >تحديث الملف الشخصي</app-button
                        >
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">تغيير كلمة المرور</h5>
            </div>
            <div class="card-body">
                <form [formGroup]="passwordForm">
                    <app-input
                        label="كلمة المرور الحالية"
                        type="password"
                        placeholder="أدخل كلمة المرور الحالية"
                        formControlName="currentPassword"
                        [error]="getCurrentPasswordError()"
                    ></app-input>

                    <app-input
                        label="كلمة المرور الجديدة"
                        type="password"
                        placeholder="أدخل كلمة المرور الجديدة"
                        formControlName="newPassword"
                        [error]="getNewPasswordError()"
                    ></app-input>

                    <app-input
                        label="تأكيد كلمة المرور الجديدة"
                        type="password"
                        placeholder="أعد إدخال كلمة المرور الجديدة"
                        formControlName="confirmPassword"
                        [error]="getConfirmPasswordError() || getPasswordMismatchError()"
                    ></app-input>

                    @if (passwordError()) {
                        <div class="alert alert-danger mt-3">
                            {{ passwordError() }}
                        </div>
                    }

                    <div class="mt-3">
                        <app-button
                            type="button"
                            variant="danger"
                            [loading]="changingPassword()"
                            (click)="changePassword()"
                            >تغيير كلمة المرور</app-button
                        >
                    </div>
                </form>
            </div>
        </div>
    }
</div>
