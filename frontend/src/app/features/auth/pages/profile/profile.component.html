<div class="profile-container">
    <h2 class="mb-4">Profile</h2>

    @if (loading()) {
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    }

    @if (!loading()) {
        @if (success()) {
            <div class="alert alert-success" role="alert">
                Changes saved successfully!
            </div>
        }

        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Personal Information</h5>
            </div>
            <div class="card-body">
                <form [formGroup]="profileForm">
                    <div class="row">
                        <div class="col-md-6">
                            <app-input
                                label="First Name"
                                type="text"
                                placeholder="Enter first name"
                                formControlName="firstName"
                                [error]="getFirstNameError()"
                            ></app-input>
                        </div>
                        <div class="col-md-6">
                            <app-input
                                label="Last Name"
                                type="text"
                                placeholder="Enter last name"
                                formControlName="lastName"
                                [error]="getLastNameError()"
                            ></app-input>
                        </div>
                    </div>

                    <app-input
                        label="Email Address"
                        type="email"
                        placeholder="Enter your email"
                        formControlName="email"
                        [error]="getEmailError()"
                    ></app-input>

                    @if (error()) {
                        <div class="alert alert-danger mt-3">
                            {{ error() }}
                        </div>
                    }

                    <div class="mt-3">
                        <app-button
                            type="button"
                            variant="primary"
                            [loading]="updating()"
                            (click)="updateProfile()"
                        >Update Profile</app-button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Change Password</h5>
            </div>
            <div class="card-body">
                <form [formGroup]="passwordForm">
                    <app-input
                        label="Current Password"
                        type="password"
                        placeholder="Enter current password"
                        formControlName="currentPassword"
                        [error]="getCurrentPasswordError()"
                    ></app-input>

                    <app-input
                        label="New Password"
                        type="password"
                        placeholder="Enter new password"
                        formControlName="newPassword"
                        [error]="getNewPasswordError()"
                    ></app-input>

                    <app-input
                        label="Confirm New Password"
                        type="password"
                        placeholder="Confirm new password"
                        formControlName="confirmPassword"
                        [error]="getConfirmPasswordError() || getPasswordMismatchError()"
                    ></app-input>

                    @if (passwordError()) {
                        <div class="alert alert-danger mt-3">
                            {{ passwordError() }}
                        </div>
                    }

                    <div class="mt-3">
                        <app-button
                            type="button"
                            variant="danger"
                            [loading]="changingPassword()"
                            (click)="changePassword()"
                        >Change Password</app-button>
                    </div>
                </form>
            </div>
        </div>
    }
</div>
