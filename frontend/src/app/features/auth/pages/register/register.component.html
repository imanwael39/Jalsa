<h2 class="page-title">إنشاء حساب</h2>

@if (success()) {
    <div class="alert alert-success">تم إنشاء الحساب بنجاح! جاري التحويل إلى صفحة تسجيل الدخول...</div>
}

@if (!success()) {
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
        <app-input
            label="الاسم الكامل"
            type="text"
            placeholder="أدخل اسمك الكامل"
            formControlName="fullName"
            [error]="getFullNameError()"
            [required]="true"
            autocomplete="name"
        ></app-input>

        <app-input
            label="البريد الإلكتروني"
            type="email"
            placeholder="أدخل بريدك الإلكتروني"
            formControlName="email"
            [error]="getEmailError()"
            [required]="true"
            autocomplete="email"
        ></app-input>

        <app-input
            label="كلمة المرور"
            type="password"
            placeholder="أنشئ كلمة مرور"
            formControlName="password"
            [error]="getPasswordError()"
            [required]="true"
            autocomplete="new-password"
        ></app-input>

        <app-input
            label="تأكيد كلمة المرور"
            type="password"
            placeholder="أعد إدخال كلمة المرور"
            formControlName="confirmPassword"
            [error]="getConfirmPasswordError() || getPasswordMismatchError()"
            [required]="true"
            autocomplete="new-password"
        ></app-input>

        <div class="field">
            <label class="label">
                نوع الحساب
                <span class="required-mark">*</span>
            </label>
            <select class="select" formControlName="role">
                <option value="Therapist">أخصائي نفسي</option>
                <option value="Patient">مريض</option>
            </select>
        </div>

        @if (isTherapist()) {
            <app-input
                label="رقم الترخيص"
                type="text"
                placeholder="أدخل رقم الترخيص المهني"
                formControlName="licenseNumber"
                autocomplete="off"
            ></app-input>

            <app-input
                label="التخصص"
                type="text"
                placeholder="أدخل مجال التخصص"
                formControlName="specialization"
                autocomplete="off"
            ></app-input>
        }

        @if (registerError()) {
            <div class="alert alert-error" role="alert">
                {{ registerError() }}
            </div>
        }

        <app-button type="submit" variant="primary" [loading]="loading()" class="submit-btn">
            @if (loading()) {
                جاري إنشاء الحساب...
            } @else {
                إنشاء الحساب
            }
        </app-button>

        <p class="switch-text">
            لديك حساب بالفعل؟
            <a routerLink="/auth/login" class="switch-link">تسجيل الدخول</a>
        </p>
    </form>
}
