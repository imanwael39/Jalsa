<div class="intake-form">
    <div class="form-header">
        <div class="header-left">
            <app-button variant="ghost" size="sm" (clicked)="goBack()" ariaLabel="العودة إلى تفاصيل المريض">
                <i class="bi bi-arrow-left" aria-hidden="true"></i> رجوع
            </app-button>
            <h1 class="form-title">استمارة الاستقبال</h1>
        </div>
    </div>

    @if (loading()) {
        <div class="loading-container">
            <app-spinner size="lg" label="جاري تحميل استمارة الاستقبال..."></app-spinner>
        </div>
    }

    @if (error()) {
        <div class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            {{ error() }}
        </div>
    }

    @if (!loading()) {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-content" novalidate>
            <div class="form-section">
                <h2 class="section-title">المعلومات السريرية</h2>
                <div class="form-grid">
                    <div class="form-field full-width">
                        <label for="presentingProblem" class="form-label">المشكلة الحالية / سبب الزيارة</label>
                        <textarea
                            id="presentingProblem"
                            class="form-control"
                            formControlName="presentingProblem"
                            name="presentingProblem"
                            rows="3"
                            placeholder="صف السبب الرئيسي للزيارة"></textarea>
                    </div>
                    <div class="form-field full-width">
                        <label for="psychiatricHistory" class="form-label">التاريخ النفسي</label>
                        <textarea
                            id="psychiatricHistory"
                            class="form-control"
                            formControlName="psychiatricHistory"
                            name="psychiatricHistory"
                            rows="3"
                            placeholder="التشخيصات والعلاجات النفسية السابقة، التنقلات المستشفية"></textarea>
                    </div>
                    <div class="form-field full-width">
                        <label for="familyHistory" class="form-label">التاريخ العائلي</label>
                        <textarea
                            id="familyHistory"
                            class="form-control"
                            formControlName="familyHistory"
                            name="familyHistory"
                            rows="3"
                            placeholder="التاريخ الطبي/النفسي العائلي ذي الصلة"></textarea>
                    </div>
                    <div class="form-field full-width">
                        <label for="medications" class="form-label">الأدوية الحالية</label>
                        <textarea
                            id="medications"
                            class="form-control"
                            formControlName="medications"
                            name="medications"
                            rows="2"
                            placeholder="أدخل الأدوية الحالية والجرعات"></textarea>
                    </div>
                    <div class="form-field full-width">
                        <label for="socialHistory" class="form-label">التاريخ الاجتماعي / معلومات أخرى</label>
                        <textarea
                            id="socialHistory"
                            class="form-control"
                            formControlName="socialHistory"
                            name="socialHistory"
                            rows="3"
                            placeholder="التاريخ الاجتماعي، معايشة، مهنة، إلخ."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <app-button
                    type="submit"
                    variant="primary"
                    [loading]="loading()"
                    ariaLabel="حفظ استمارة الاستقبال">
                    حفظ استمارة الاستقبال
                </app-button>
                <app-button
                    type="button"
                    variant="secondary"
                    (clicked)="goBack()"
                    [disabled]="loading()"
                    ariaLabel="إلغاء والعودة">
                    إلغاء
                </app-button>
            </div>
        </form>
    }
</div>
