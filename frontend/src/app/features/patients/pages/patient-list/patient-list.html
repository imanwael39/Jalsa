<div class="patient-list">
    <div class="page-header">
        <h2 class="page-title">المرضى</h2>
        <app-button variant="primary" (clicked)="navigateToNew()" ariaLabel="إضافة مريض جديد">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> إضافة مريض +
        </app-button>
    </div>

    <div class="filters">
        <div class="search-wrapper">
            <i class="bi bi-search search-icon"></i>
            <input
                type="search"
                class="search-input"
                placeholder="بحث في المرضى..."
                [value]="searchTerm"
                (input)="onSearch($any($event.target).value)"
                ariaLabel="بحث في المرضى"
            />
        </div>
        <div class="form-check">
            <input
                class="form-check-input"
                type="checkbox"
                id="includeArchived"
                [(ngModel)]="includeArchived"
                (ngModelChange)="onToggleArchived()"
            />
            <label class="form-check-label" for="includeArchived">عرض المؤرشفين</label>
        </div>
    </div>

    @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
    }

    <div class="table-responsive">
        <app-table
            [data]="patients()"
            [columns]="columns"
            [loading]="loading()"
            emptyMessage="لم يتم العثور على مرضى"
            (rowClick)="onRowClick($event)"
        >
            <ng-template appColumnCell="dateOfBirth" let-row>
                {{ formatDate(row.dateOfBirth) }}
            </ng-template>
            <ng-template appColumnCell="status" let-row>
                <span
                    class="badge"
                    [class.bg-success]="row.status === 'Active'"
                    [class.bg-danger]="row.status === 'Archived'"
                >
                    {{ row.status | statusAr }}
                </span>
            </ng-template>
            <ng-template appColumnCell="actions" let-row>
                <div class="d-flex gap-1 justify-content-center">
                    <app-button variant="secondary" size="sm" (clicked)="navigateToView(row.id)" ariaLabel="عرض المريض">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </app-button>
                    <app-button variant="primary" size="sm" (clicked)="navigateToEdit(row.id)" ariaLabel="تعديل المريض">
                        <i class="bi bi-pencil" aria-hidden="true"></i>
                    </app-button>
                    @if (row.status === 'Active') {
                        <app-button
                            variant="danger"
                            size="sm"
                            (clicked)="archivePatient(row.id)"
                            ariaLabel="أرشفة المريض"
                        >
                            <i class="bi bi-archive" aria-hidden="true"></i>
                        </app-button>
                    } @else {
                        <app-button
                            variant="secondary"
                            size="sm"
                            (clicked)="restorePatient(row.id)"
                            ariaLabel="استعادة المريض"
                        >
                            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                        </app-button>
                    }
                </div>
            </ng-template>
        </app-table>
    </div>

    @if (totalItems > 0) {
        <div class="mt-3">
            <app-pagination
                [totalItems]="totalItems"
                [pageSize]="pageSize"
                [currentPage]="currentPage"
                (pageChange)="onPageChange($event)"
            ></app-pagination>
        </div>
    }
</div>
