<div class="assign-exercise">
    <div class="page-header">
        <h2 class="page-title">تعيين تمرين للمريض</h2>
    </div>

    @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
    }

    @if (loading() && patients().length === 0) {
        <div class="text-center py-5">
            <app-spinner size="lg" label="جاري تحميل المرضى..."></app-spinner>
        </div>
    } @else {
        @if (patients().length === 0) {
            <div class="alert alert-info">لا يوجد مرضى متاحون. يرجى إضافة المرضى أولاً.</div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group mb-3">
                <label for="patientId" class="form-label">
                    المريض <span class="text-danger">*</span>
                </label>
                <select
                    id="patientId"
                    class="form-select"
                    formControlName="patientId"
                    [class.is-invalid]="f['patientId'].touched && f['patientId'].invalid"
                    aria-describedby="patientIdError"
                >
                    <option value="">اختر المريض</option>
                    @for (patient of patients(); track patient.id) {
                        <option [value]="patient.id">{{ patient.fullName }}</option>
                    }
                </select>
                @if (f['patientId'].touched && f['patientId'].errors?.['required']) {
                    <div class="invalid-feedback" id="patientIdError">المريض مطلوب.</div>
                }
            </div>

            <app-input
                label="الوصف"
                type="text"
                formControlName="description"
                [required]="true"
                [error]="f['description'].touched && f['description'].errors?.['required'] ? 'الوصف مطلوب.' : f['description'].errors?.['maxlength'] ? 'الوصف يجب ألا يتجاوز 1000 حرف.' : ''"
                placeholder="صف التمارين للمريض"
            ></app-input>

            <app-input
                label="التكرار"
                type="text"
                formControlName="frequency"
                placeholder="مثال: 3 مرات في الأسبوع"
                helpText="كم مرة يجب على المريض أداء هذا التمرين"
            ></app-input>

            <app-input
                label="تاريخ البدء"
                type="date"
                formControlName="startDate"
            ></app-input>

            <app-input
                label="تاريخ الاستحقاق"
                type="date"
                formControlName="dueDate"
            ></app-input>

            <div class="d-flex gap-2 mt-4">
                <app-button
                    type="submit"
                    variant="primary"
                    [loading]="loading()"
                    [disabled]="loading()"
                    ariaLabel="إنشاء وتعيين التمرين"
                >
                    تعيين التمرين
                </app-button>
                <app-button
                    type="button"
                    variant="secondary"
                    [disabled]="loading()"
                    (clicked)="navigateBack()"
                    ariaLabel="إلغاء والعودة"
                >
                    إلغاء
                </app-button>
            </div>
        </form>
    }
</div>
