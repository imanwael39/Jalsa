<div class="exercise-list">
    <div class="page-header">
        <h2 class="page-title">التمارين</h2>
        <app-button variant="primary" (clicked)="navigateToAssign()" ariaLabel="إضافة تمرين جديد">
            <i class="bi bi-plus-lg" aria-hidden="true"></i> إضافة تمرين +
        </app-button>
    </div>

    @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
    }

    <div class="table-responsive">
        <app-table
            [data]="exercises()"
            [columns]="columns"
            [loading]="loading()"
            emptyMessage="لم يتم العثور على تمارين."
        >
            <ng-template appColumnCell="description" let-row>
                {{ row.description | truncate: 80 }}
            </ng-template>
            <ng-template appColumnCell="frequency" let-row>
                {{ row.frequency || '-' }}
            </ng-template>
            <ng-template appColumnCell="status" let-row>
                <span
                    class="badge"
                    [class.bg-secondary]="row.status === 'NotStarted'"
                    [class.bg-warning]="row.status === 'InProgress'"
                    [class.bg-success]="row.status === 'Completed'"
                >
                    {{ row.status | statusAr }}
                </span>
            </ng-template>
            <ng-template appColumnCell="dueDate" let-row>
                {{ formatDate(row.dueDate) }}
            </ng-template>
            <ng-template appColumnCell="actions" let-row>
                <div class="d-flex gap-1 justify-content-center">
                    <app-button variant="danger" size="sm" (clicked)="openDeleteModal(row.id)" ariaLabel="حذف التمرين">
                        <i class="bi bi-trash" aria-hidden="true"></i>
                    </app-button>
                </div>
            </ng-template>
        </app-table>
    </div>

    <app-modal
        [showModal]="showDeleteModal()"
        (showModalChange)="showDeleteModal.set($event)"
        title="حذف التمرين"
        size="sm"
    >
        <div modal-body>
            <p>هل أنت متأكد من حذف هذا التمرين؟</p>
            <p class="text-danger">
                <i class="bi bi-exclamation-triangle" aria-hidden="true"></i> لا يمكن التراجع عن هذا الإجراء.
            </p>
        </div>
        <div modal-footer>
            <app-button variant="ghost" (clicked)="closeDeleteModal()">إلغاء</app-button>
            <app-button variant="danger" (clicked)="deleteExercise()">حذف التمرين</app-button>
        </div>
    </app-modal>
</div>
